name: Commerce Engineering Lab

on:
  pull_request:
    paths:
      - '.github/workflows/training.yml'
      - 'Dockerfile'
      - 'src/**'
      - 'training/**'
  workflow_dispatch:

jobs:
  framework-and-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Create local-only training configuration
        shell: pwsh
        run: Copy-Item training/.env.example training/.env
      - name: Restore
        run: dotnet restore src/NopCommerce.sln
      - name: Build
        run: dotnet build src/NopCommerce.sln --configuration Release --no-restore
      - name: Framework and API infrastructure tests
        run: >-
          dotnet test src/Tests/Nop.Tests/Nop.Tests.csproj
          --configuration Release --no-build
          --filter "FullyQualifiedName~TaskManifestValidatorTests|FullyQualifiedName~TrainingApiInfrastructureTests"
      - name: Validate task framework and repository separation
        shell: pwsh
        run: ./training/scripts/verify-task-framework.ps1
      - name: Verify initializer installation result detection
        shell: pwsh
        run: ./training/scripts/verify-initializer-result.ps1
      - name: Bootstrap and verify Docker, HTTP, SQL, Redis, API, and OpenAPI
        shell: pwsh
        run: ./training/scripts/bootstrap.ps1
      - name: Verify Phase 4 pilot baselines
        shell: pwsh
        run: ./training/scripts/verify-pilot-baselines.ps1
      - name: Verify clean reset from an empty training database
        shell: pwsh
        run: |
          ./training/scripts/reset.ps1
          ./training/scripts/install-training-api.ps1
          ./training/scripts/verify-contract.ps1
          ./training/scripts/verify-api.ps1
      - name: Diagnose training containers on failure
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $compose = @(
            'compose',
            '--project-name', 'commerce-engineering-lab',
            '--env-file', 'training/.env',
            '--file', 'training/compose.yml'
          )

          foreach ($line in Get-Content -LiteralPath training/.env) {
            if ($line -match '^(MSSQL_SA_PASSWORD|TRAINING_ADMIN_PASSWORD|TRAINING_API_KEY)=(.+)$') {
              Write-Output "::add-mask::$($Matches[2])"
            }
          }

          & docker @compose ps --all
          & docker @compose logs --no-color --tail 300 app initializer seed

          $inspectCommand = @'
          echo "=== /app/App_Data files ==="
          find /app/App_Data -maxdepth 3 -type f -print | sort

          echo "=== Training.Api image artifacts ==="
          for path in \
            /app/Plugins/Training.Api/plugin.json \
            /app/Plugins/Training.Api/Nop.Plugin.Training.Api.dll
          do
            if [ -f "$path" ]; then
              ls -l "$path"
            else
              echo "MISSING: $path"
            fi
          done
          '@

          & docker @compose exec --no-TTY app sh -c $inspectCommand
      - name: Stop training containers
        if: always()
        shell: pwsh
        run: ./training/scripts/stop.ps1
